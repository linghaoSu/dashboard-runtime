variables:
  CI_BUILDER_VERSION: v0.1.74
  I18N_CHECK_VERSION: latest
  PNPM_STORE_DIR: "/pnpm-store"
  CI_NODE_VERSION: 20.19.5
default:
  image: docker.m.daocloud.io/node:$CI_NODE_VERSION
  tags:
    - k8s
  retry:
    max: 2
  before_script:
    - export PNPM_HOME="/pnpm"
    - export PATH="$PNPM_HOME:$PATH"
    - export COREPACK_NPM_REGISTRY=https://registry.npmmirror.com
    - set -ex
    - cd $CI_PROJECT_DIR
    - corepack enable
    - env
    - echo "before_script"
    - node -v
    - pnpm -v
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
  interruptible: true

stages:
  - test
  - pre-build
  - build
  - post-build
  - e2e
  - version
  - i18n-check
  - release
  - post-merge-build

lint_test:
  stage: test
  script:
    - make lint
  rules:
    - if: "$RELEASE"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release/'

unit_test:
  stage: test
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  script:
    - make unit-test
  artifacts:
    when: always
    reports:
      junit:
        - junit.xml
  rules:
    - if: "$RELEASE"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release/'

build_local:
  stage: pre-build
  tags:
    - docker
  script:
    - export NODE_OPTIONS=--max_old_space_size=8192
    - export VUE_APP_PUBLIC_BASE_PATH=./
    - pnpm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - dist/
  rules:
    - if: "$RELEASE"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release/ || $CI_COMMIT_TAG'

build_test:
  stage: build
  image:
    name: release-ci.daocloud.io/common-ci/common-ci-builder:$CI_BUILDER_VERSION
  tags:
    - docker
  before_script:
    - docker -v #override the global before_script
  dependencies:
    - build_local
  script:
    - export REGISTRY_SERVER_ADDRESS=$DEV_REGISTRY_SERVER_ADDRESS
    - make release
  rules:
    - if: "$RELEASE"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release/ || $CI_COMMIT_TAG'

build_prod:
  stage: build
  image:
    name: release-ci.daocloud.io/common-ci/common-ci-builder:$CI_BUILDER_VERSION
  tags:
    - docker
  before_script:
    - docker -v #override the global before_script
  dependencies:
    - build_local
  script:
    - export REGISTRY_SERVER_ADDRESS=$PROD_REGISTRY_SERVER_ADDRESS
    - make release
  rules:
    - if: "$CI_COMMIT_TAG"

cve_scan:
  stage: post-build
  image:
    name: release-ci.daocloud.io/common-ci/common-ci-builder:$CI_BUILDER_VERSION
  tags:
    - docker
  script:
    - export REGISTRY_SERVER_ADDRESS=$DEV_REGISTRY_SERVER_ADDRESS
    - make cve-scan
  dependencies: []
  rules:
    - if: "$RELEASE"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^release/'
  before_script:
    - docker -v #override the global before_script
    - docker run -d --network none --name trivy-container release-ci.daocloud.io/ghcr/aquasecurity/trivy sleep 1000
    - docker cp trivy-container:/usr/local/bin/trivy /usr/local/bin/trivy #Install trivy
    - docker rm -f trivy-container

deploy_to_dev:
  stage: post-build
  image:
    name: release.daocloud.io/frontend-ci/kubectl:v1.13.9
    entrypoint: [""]
  before_script: []
  script:
    - export kubeconfig=$DEV_KUBECONF
    - export REGISTRY_SERVER_ADDRESS=$DEV_REGISTRY_SERVER_ADDRESS
    - make deploy
  dependencies: []
  rules:
    - if: "$RELEASE"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_to_test:
  stage: post-build
  image:
    name: release.daocloud.io/frontend-ci/kubectl:v1.13.9
    entrypoint: [""]
  allow_failure: true
  before_script: []
  script:
    - export dev_kubeconfig=$DEV_KUBECONF
    - export test_kubeconfig=$TEST_KUBECONF
    - export REGISTRY_SERVER_ADDRESS=$DEV_REGISTRY_SERVER_ADDRESS
    - make deploy-test
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

change_backend_version:
  stage: version
  before_script:
    - set -ex
    - cd $CI_PROJECT_DIR
    - env
    - echo "before_script"
    - node -v
    - npm -v
    - npm i esno@0.16.3 tsx@3.2.1 fs-extra@10.1.0 semver@7.3.8 --no-save --registry=https://registry.npmmirror.com --force
  dependencies: []
  script:
    - make change-version
  rules:
    - if: "$CI_COMMIT_TAG"

cherry_pick:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  image:
    name: release-ci.daocloud.io/common-ci/common-ci-builder:$CI_BUILDER_VERSION
  stage: post-merge-build
  before_script:
    - apt-get install jq -y
  dependencies: []
  script:
    - bash ./scripts/cherry-pick.sh

minor_release:
  stage: release
  before_script:
    - set -ex
    - env
    - npm i esno@0.16.3 tsx@3.2.1 fs-extra@10.1.0 --no-save --registry=https://registry.npmmirror.com --force
    - npm i -g conventional-changelog-cli @jsdevtools/version-bump-prompt --registry=https://registry.npmmirror.com --force
  script:
    - make minor-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $RELEASE == "minor"'
  interruptible: false

patch_release:
  stage: release
  before_script:
    - set -ex
    - env
    - npm i esno@0.16.3 tsx@3.2.1 fs-extra@10.1.0 --no-save --registry=https://registry.npmmirror.com --force
    - npm i -g conventional-changelog-cli @jsdevtools/version-bump-prompt --registry=https://registry.npmmirror.com --force
  script:
    - make patch-release
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release/ && $RELEASE == "patch"'
  interruptible: false

i18n-check:
  stage: i18n-check
  image: release-ci.daocloud.io/common-ci/i18n-check:$I18N_CHECK_VERSION
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  before_script:
    - set -ex
  script:
    - i18nCheck
  rules:
    - if: "$RELEASE"
